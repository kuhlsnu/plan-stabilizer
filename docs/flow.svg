<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 706" width="640" height="706" role="img" aria-label="Flow: a design is classified, split into Lane A and Lane B, audited, checked by stabilizer-gate which sends corrections back to the audit, then a decision is presented and you choose.">
  <style>
    .bx { fill: none; stroke: #57606a; stroke-width: 1.5; }
    .tx { fill: #1f2328; font-size: 15px; }
    .sub { fill: #57606a; font-size: 13px; }
    .ln { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .lbl { fill: #57606a; font-size: 12px; font-style: italic; }
    .hd { fill: #0969da; }
    @media (prefers-color-scheme: dark) {
      .bx { stroke: #8b949e; }
      .tx { fill: #e6edf3; }
      .sub { fill: #9198a1; }
      .ln { stroke: #8b949e; }
      .lbl { fill: #9198a1; }
      .hd { fill: #58a6ff; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
  </defs>

  <rect class="bx" x="200" y="20" width="240" height="44" rx="6"/>
  <text class="tx" x="320" y="48" text-anchor="middle">Design or plan</text>
  <path class="ln" d="M320,64 V104" marker-end="url(#a)"/>

  <rect class="bx" x="200" y="104" width="240" height="44" rx="6"/>
  <text class="tx" x="320" y="132" text-anchor="middle">Classify the problem</text>
  <path class="ln" d="M320,148 V188" marker-end="url(#a)"/>

  <rect class="bx" x="255" y="188" width="130" height="44" rx="22"/>
  <text class="tx" x="320" y="216" text-anchor="middle">Split</text>

  <path class="ln" d="M290,232 C240,252 190,252 150,272" marker-end="url(#a)"/>
  <path class="ln" d="M350,232 C400,252 450,252 490,272" marker-end="url(#a)"/>

  <rect class="bx" x="40" y="272" width="220" height="60" rx="6"/>
  <text class="tx hd" x="150" y="296" text-anchor="middle">Lane A</text>
  <text class="sub" x="150" y="316" text-anchor="middle">minimal slice</text>

  <rect class="bx" x="380" y="272" width="220" height="60" rx="6"/>
  <text class="tx hd" x="490" y="296" text-anchor="middle">Lane B</text>
  <text class="sub" x="490" y="316" text-anchor="middle">the vision, verbatim</text>

  <path class="ln" d="M150,332 C150,356 240,356 300,376" marker-end="url(#a)"/>
  <path class="ln" d="M490,332 C490,356 400,356 340,376" marker-end="url(#a)"/>

  <rect class="bx" x="200" y="376" width="240" height="44" rx="6"/>
  <text class="tx" x="320" y="404" text-anchor="middle">Audit + flags</text>
  <path class="ln" d="M290,420 V460" marker-end="url(#a)"/>

  <rect class="bx" x="200" y="460" width="240" height="60" rx="6"/>
  <text class="tx" x="320" y="484" text-anchor="middle">stabilizer-gate</text>
  <text class="sub" x="320" y="504" text-anchor="middle">5 checks</text>

  <path class="ln" d="M400,460 C440,440 440,436 400,420" marker-end="url(#a)"/>
  <text class="lbl" x="452" y="444">corrections</text>

  <path class="ln" d="M320,520 V560" marker-end="url(#a)"/>

  <rect class="bx" x="170" y="560" width="300" height="44" rx="6"/>
  <text class="tx" x="320" y="588" text-anchor="middle">Decision, no recommendation</text>
  <path class="ln" d="M320,604 V644" marker-end="url(#a)"/>

  <rect class="bx" x="235" y="644" width="170" height="44" rx="22"/>
  <text class="tx" x="320" y="672" text-anchor="middle">You choose</text>
</svg>
