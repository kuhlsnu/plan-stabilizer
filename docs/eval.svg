<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-label="Eval breakdown: 15 constraints split into 10 that held at 100 percent, which get no check, and 7 flaky, of which the 5 worst become gate checks and 2 are skipped.">
  <style>
    .bx { fill: none; stroke: #57606a; stroke-width: 1.5; }
    .tx { fill: #1f2328; font-size: 15px; }
    .sub { fill: #57606a; font-size: 13px; }
    .ln { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .hd { fill: #0969da; }
    @media (prefers-color-scheme: dark) {
      .bx { stroke: #8b949e; }
      .tx { fill: #e6edf3; }
      .sub { fill: #9198a1; }
      .ln { stroke: #8b949e; }
      .hd { fill: #58a6ff; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
  </defs>

  <rect class="bx" x="20" y="118" width="170" height="60" rx="6"/>
  <text class="tx" x="105" y="142" text-anchor="middle">15 constraints</text>
  <text class="sub" x="105" y="162" text-anchor="middle">15 runs each</text>

  <path class="ln" d="M190,138 C230,118 240,94 275,74" marker-end="url(#b)"/>
  <path class="ln" d="M190,158 C230,178 240,202 275,222" marker-end="url(#b)"/>

  <rect class="bx" x="275" y="44" width="170" height="44" rx="6"/>
  <text class="tx" x="360" y="72" text-anchor="middle">10 held at 100%</text>

  <rect class="bx" x="275" y="200" width="170" height="44" rx="6"/>
  <text class="tx" x="360" y="228" text-anchor="middle">7 flaky</text>

  <path class="ln" d="M445,66 H495" marker-end="url(#b)"/>
  <rect class="bx" x="495" y="44" width="125" height="44" rx="6"/>
  <text class="sub" x="557" y="72" text-anchor="middle">no check</text>

  <path class="ln" d="M445,214 C470,198 470,182 495,166" marker-end="url(#b)"/>
  <rect class="bx" x="495" y="136" width="125" height="60" rx="6"/>
  <text class="tx hd" x="557" y="160" text-anchor="middle">5 worst</text>
  <text class="sub" x="557" y="180" text-anchor="middle">the gate</text>

  <path class="ln" d="M445,232 C470,240 470,248 495,256" marker-end="url(#b)"/>
  <rect class="bx" x="495" y="234" width="125" height="44" rx="6"/>
  <text class="sub" x="557" y="262" text-anchor="middle">2 skipped</text>
</svg>
